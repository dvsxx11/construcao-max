<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar Conta - Materiais de Construção</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <h1>CONSTRUÇÃO<span>MAX</span></h1>
        <p>Sistema de Gerenciamento de Produtos</p>
      </div>

      <h2 class="auth-title">Criar nova conta</h2>

      <div class="alert alert-error" id="alerta-erro">
        <span id="msg-erro">Erro ao cadastrar!</span>
      </div>

      <div class="alert alert-success" id="alerta-sucesso">
        <span>Conta criada! Redirecionando para o login...</span>
      </div>

      <form class="auth-form" id="form-cadastro">
        <div class="form-group">
          <label class="form-label" for="nome"> Nome completo </label>

          <input
            type="text"
            id="nome"
            class="form-input"
            placeholder="João da Silva"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email"> E-mail </label>

          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="seu@email.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="senha"> Senha </label>

          <input
            type="password"
            id="senha"
            class="form-input"
            placeholder="Mínimo 6 caracteres"
            required
            minlength="6"
            autocomplete="new-password"
          />

          <span class="form-hint"> Mínimo de 6 caracteres </span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmar-senha">
            Confirmar senha
          </label>

          <input
            type="password"
            id="confirmar-senha"
            class="form-input"
            placeholder="Repita a senha"
            required
            autocomplete="new-password"
          />
        </div>

        <button
          type="submit"
          class="btn btn-success btn-full"
          id="btn-cadastrar"
        >
          Criar Conta
        </button>
      </form>

      <div class="auth-link">
        Já tem conta?
        <a href="login.html"> Fazer login </a>
      </div>
    </div>

    <script src="cadastro.js"></script>
  </body>
</html>
